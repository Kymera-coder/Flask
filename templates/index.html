<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Python Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 40px;
        }
        h1 {
            color: #58a6ff;
        }
        .project {
            background: #161b22;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
        }
        .tech {
            color: #8b949e;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>👋 Hi, I'm Matheus</h1>
    <p>Python developer focused on automation, Discord bots, and web applications.</p>

    <h2>🚀 Projects</h2>

    {% for project in projects %}
        <div class="project">
            <h3>{{ project.name }}</h3>
            <p>{{ project.description }}</p>
            <p class="tech">{{ project.tech }}</p>
        </div>
    {% endfor %}

</body>
</html>
